[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-image-creatives"
version = "1.0.0"
description = "Generate ad creatives from references via GPT Image API and resize to banner sizes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.75.0",
  "Pillow>=10.4.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
generate-creatives = "generate_creatives:main"

[tool.setuptools]
py-modules = ["generate_creatives", "resize_only"]

[tool.setuptools.packages.find]
include = ["creatives*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
