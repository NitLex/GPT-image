# Example config for the creatives pipeline.
# Run: python generate_creatives.py --config config.example.yaml

references_dir: references
output_dir: output

# Offer / headline substitution
offer: "Скидка 30% на первый заказ"
headline: "Доставка за 15 минут"
cta: "Заказать сейчас"
brand: "BrandName"
extra_instructions: >
  Keep the same layout, colors, typography mood and composition as the references.
  Replace only the offer text and headline. Do not invent new logos.

# How many variants to generate per reference (or per batch)
variants: 3

# Master generation size sent to the API (before local resize)
# For gpt-image-1 / 1.5: 1024x1024 | 1024x1536 | 1536x1024 | auto
# For gpt-image-2: many resolutions are supported, e.g. 1536x1024
master_size: "1536x1024"
quality: high
model: gpt-image-1.5

# Send all references in one request (style-consistent batch)
# or process each reference separately
mode: batch  # batch | per_reference

# Local resize targets (IAB / common display sizes)
sizes:
  - 300x250
  - 728x90
  - 970x250
  - 160x600
  - 300x600
  - 320x50
  - 336x280
  - 970x90

# cover = crop to fill | contain = letterbox with fill color
resize_mode: cover
fill_color: "#0B0B0B"
output_format: png  # png | jpeg | webp
